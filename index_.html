<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>TNT 社会人バレーサークル｜参加申し込み</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fff8f1;
    --card:#ffffff;
    --text:#4a3b31;
    --muted:#9a897b;
    --orange:#ff7a3d;
    --orange-dark:#e8611f;
    --orange-soft:#ffe4d1;
    --waitlist:#e8a33d;
    --waitlist-dark:#c97f1e;
    --waitlist-soft:#fbe8c8;
    --ended:#c9c2ba;
    --ended-text:#7a716a;
    --border:#f1ddc9;
    --line:#06c755;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic",-apple-system,BlinkMacSystemFont,sans-serif;
    background:linear-gradient(180deg,#fff8f1 0%,#fff3e6 100%);
    color:var(--text);
    line-height:1.75;
  }
  .wrap{max-width:640px;margin:0 auto;padding:28px 18px 60px;}
  header.top{text-align:center;margin-bottom:22px;}
  header.top .logo{
    display:inline-block;font-size:26px;font-weight:900;letter-spacing:.06em;
    color:var(--orange-dark);background:var(--orange-soft);padding:8px 22px;border-radius:999px;
  }
  header.top p{color:var(--muted);font-size:13px;margin:10px 0 0;}
  .card{
    background:var(--card);border:1px solid var(--border);border-radius:18px;
    padding:20px 20px;margin-bottom:18px;box-shadow:0 4px 16px rgba(232,97,31,.06);
  }
  .notice{background:#fff3e0;border:1px solid #ffd9ae;border-radius:16px;padding:18px 20px;margin-bottom:24px;font-size:14px;}
  .notice strong{color:var(--orange-dark);}
  .notice a{color:var(--orange-dark);font-weight:700;word-break:break-all;}
  .link-green{color:var(--line);font-weight:700;text-decoration:underline;}
  .link-blue{color:#2f6fda;font-weight:700;text-decoration:underline;}
  h2.section-title{font-size:16px;color:var(--orange-dark);border-left:6px solid var(--orange);padding-left:10px;margin:30px 0 14px;}
  .event-row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;}
  .event-info{flex:1;min-width:200px;}
  .event-date{font-weight:800;font-size:16px;color:var(--text);}
  .event-meta{color:var(--muted);font-size:13px;margin-top:4px;}
  .badge{display:inline-block;font-size:12px;font-weight:700;padding:4px 12px;border-radius:999px;margin-bottom:6px;}
  .badge.open{background:var(--orange-soft);color:var(--orange-dark);}
  .badge.waitlist{background:var(--waitlist-soft);color:var(--waitlist-dark);}
  .badge.ended{background:#eee9e4;color:var(--ended-text);}
  .btn{display:inline-block;text-decoration:none;font-weight:700;font-size:14px;padding:11px 20px;border-radius:999px;border:none;cursor:pointer;text-align:center;white-space:nowrap;}
  .btn.open{background:linear-gradient(135deg,#ff9a5c,var(--orange));color:#fff;box-shadow:0 4px 10px rgba(255,122,61,.35);}
  .btn.waitlist{background:linear-gradient(135deg,#f0bb64,var(--waitlist));color:#fff;box-shadow:0 4px 10px rgba(232,163,61,.35);}
  .btn.ended{background:var(--ended);color:var(--ended-text);cursor:not-allowed;}
  .btn.wide{display:block;width:100%;padding:14px;font-size:15px;margin-top:8px;}
  .detail{white-space:pre-wrap;font-size:14.5px;background:#fffaf4;border:1px dashed #f0c896;border-radius:14px;padding:16px 18px;margin:16px 0;}
  .emphasis{background:#fff0da;border:2px solid var(--waitlist);border-radius:14px;padding:14px 16px;font-weight:700;color:var(--waitlist-dark);margin:16px 0;font-size:14.5px;}
  label{display:block;font-weight:700;font-size:14px;margin:16px 0 6px;}
  input[type=text]{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--border);font-size:15px;background:#fffdfb;}
  input[type=text]:focus{outline:2px solid var(--orange);border-color:var(--orange);}
  .error-box{background:#fdeceb;border:1px solid #f3b5ae;color:#c0392b;padding:12px 16px;border-radius:12px;font-size:13.5px;margin-bottom:16px;}
  .faq dt{font-weight:700;color:var(--orange-dark);margin-top:14px;}
  .faq dd{margin:4px 0 0;color:var(--text);font-size:14px;}
  footer{text-align:center;margin-top:36px;color:var(--muted);font-size:12px;}
  .sns{display:flex;justify-content:center;gap:16px;margin:18px 0;}
  .sns a{display:inline-flex;align-items:center;gap:6px;text-decoration:none;font-size:13px;font-weight:700;padding:9px 16px;border-radius:999px;background:var(--card);border:1px solid var(--border);color:var(--text);}
  .center{text-align:center;}
  .done-icon{font-size:48px;text-align:center;margin:18px 0 6px;}
  .back-link{display:block;text-align:center;margin-top:18px;color:var(--muted);font-size:13px;text-decoration:none;}
  .small-note{font-size:12px;color:var(--muted);margin-top:14px;}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="logo">TNT 社会人バレーサークル</div>
    <p>参加申し込みページ</p>
  </header>
  <div id="app"><div class="card center">読み込み中...</div></div>
  <footer>
    <div class="sns">
      <a href="https://www.instagram.com/volleycircle.tnt/" target="_blank" rel="noopener">📷 Instagram</a>
      <a href="https://www.tiktok.com/@tnt25620?is_from_webapp=1&sender_device=pc" target="_blank" rel="noopener">🎵 TikTok</a>
    </div>
    <div>© TNT 社会人バレーサークル</div>
  </footer>
</div>

<script>
const SUPABASE_URL = "https://blyjdnsdsnjfqicqkivx.supabase.co";
const ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJseWpkbnNkc25qZnFpY3FraXZ4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU0NTMxNDcsImV4cCI6MjEwMTAyOTE0N30.ZQbVEbOrE5Cp3hvMLG6wghkUyWxw2fkIPxC1x3TDFi4";
const LINE_URL = "https://line.me/R/ti/p/@087leaew?ts=02110704&oat_content=url";
const DOW = ["日","月","火","水","木","金","土"];

function esc(s){
  return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function fmtDateJp(dateStr){
  const [y,m,d] = dateStr.split("-").map(Number);
  const dow = DOW[new Date(Date.UTC(y, m-1, d)).getUTCDay()];
  return `${m}/${d}(${dow})`;
}
function hm(t){ return (t||"").slice(0,5); }
function subtractMinutes(t, mins){
  const [h,m] = hm(t).split(":").map(Number);
  let total = h*60+m-mins;
  if (total < 0) total += 24*60;
  return String(Math.floor(total/60)).padStart(2,"0") + ":" + String(total%60).padStart(2,"0");
}

async function rpc(name, params){
  const res = await fetch(`${SUPABASE_URL}/rest/v1/rpc/${name}`, {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "apikey": ANON_KEY,
      "Authorization": `Bearer ${ANON_KEY}`,
    },
    body: JSON.stringify(params || {}),
  });
  let data = null;
  try { data = await res.json(); } catch (e) {}
  return { ok: res.ok, status: res.status, data };
}

function eventDetailText(ev, gatherTime){
  const mapLink = `<a href="${esc(ev.venue_map_url)}" target="_blank" rel="noopener" class="link-blue">地図を見る</a>`;
  return `【詳細🏐】
🍀日時:${fmtDateJp(ev.event_date)} ${hm(ev.start_time)}-${hm(ev.end_time)}
　<<集合 ${gatherTime}>>
🍀場所: ${esc(ev.venue_name)}
　🗺 ${mapLink}
　🚃最寄り：${esc(ev.nearest_station)}
🍀参加費：${esc(ev.fee)}
🍀持ち物：${esc(ev.belongings)}
🍀終了後、1時間ほど会場近くでご飯に行きます🍽
　任意参加ですが、ぜひ一緒に行けると嬉しいです🥰
================================
【注意事項】
◎参加者同士の執拗な連絡先交換、他サークル・別イベント等のお誘いは
  全員が安心して楽しんでいただくため、ご遠慮ください🙏✨
  発覚した場合、強制退会等の対応を実施させていただきます。
⚠当日キャンセル、無断欠席のないようご協力お願いします🥺
    　(キャンセル待ちで参加できない方がいます!!)
    　どちらも原則キャンセル料をお願いしています🙇‍♀
⚠参加できなくなった場合は、公式LINE宛てにキャンセル連絡お願いします❣`;
}

function parseHash(){
  const h = location.hash.replace(/^#\/?/, "");
  if (!h) return { view: "home" };
  const [path, qs] = h.split("?");
  const params = new URLSearchParams(qs || "");
  if (path === "event") return { view: "event", id: params.get("id"), type: params.get("type") || "signup" };
  return { view: "home" };
}

async function renderHome(app){
  const { ok, data } = await rpc("get_home_events", {});
  if (!ok) {
    app.innerHTML = `<div class="card">読み込みに失敗しました。時間をおいて再度お試しください。</div>`;
    return;
  }
  const events = data || [];
  const rows = events.map(ev => {
    let badge, btn;
    if (ev.status === "open") {
      badge = `<span class="badge open">募集中</span>`;
      btn = `<a class="btn open" href="#/event?id=${ev.id}&type=signup">参加申し込み</a>`;
    } else if (ev.status === "waitlist") {
      badge = `<span class="badge waitlist">キャンセル待ち</span>`;
      btn = `<a class="btn waitlist" href="#/event?id=${ev.id}&type=waitlist">キャンセル待ち申し込み</a>`;
    } else {
      badge = `<span class="badge ended">終了</span>`;
      btn = `<button class="btn ended" disabled>開催終了</button>`;
    }
    return `<div class="card">
      <div>${badge}</div>
      <div class="event-row">
        <div class="event-info">
          <div class="event-date">${fmtDateJp(ev.event_date)} ${hm(ev.start_time)}〜${hm(ev.end_time)}</div>
          <div class="event-meta">📍 ${esc(ev.venue_name)}</div>
        </div>
        <div>${btn}</div>
      </div>
    </div>`;
  }).join("\n");

  const listHtml = events.length ? rows : `<div class="card center" style="color:var(--muted);">今月の開催日は現在準備中です。公式LINEもあわせてご確認ください。</div>`;

  app.innerHTML = `
  <div class="notice">
    このホームページは、本サークルの<strong>2回目以降参加の方限定</strong>の申し込みページです。<br>
    初めて参加する方は、必ず<strong>公式LINE</strong>から申し込みください。※初参加優先枠ございます。<br>
    <a href="${LINE_URL}" target="_blank" rel="noopener" class="link-green">▶ 公式LINEはこちら</a>
  </div>

  <h2 class="section-title">開催日一覧</h2>
  ${listHtml}

  <h2 class="section-title">FAQ</h2>
  <div class="card faq">
    <dl>
      <dt>Q. キャンセルしたいときは？</dt>
      <dd>A. お手数ですが、必ず公式LINEまでご連絡ください。このページからのキャンセル手続きはできません。</dd>
      <dt>Q. 当日遅刻しそうなときは？</dt>
      <dd>A. 分かった時点で公式LINEまでご連絡をお願いします。</dd>
      <dt>Q. 友達を誘って一緒に参加したい場合は？</dt>
      <dd>A. お手数ですが、公式LINEまでご連絡ください。個別にご案内いたします。</dd>
    </dl>
  </div>
  `;
}

async function renderEventPage(app, id, type, errorMsg){
  if (!id || (type !== "signup" && type !== "waitlist")) {
    app.innerHTML = `<div class="card">不正なリクエストです。<a class="back-link" href="#/">ホームへ戻る</a></div>`;
    return;
  }
  const { ok, data: ev } = await rpc("get_event_detail", { p_id: id });
  if (!ok || !ev) {
    app.innerHTML = `<div class="card">開催日が見つかりませんでした。<a class="back-link" href="#/">ホームへ戻る</a></div>`;
    return;
  }
  if (ev.status === "ended") {
    app.innerHTML = `<div class="card center">この開催日はすでに終了しています。<a class="back-link" href="#/">ホームへ戻る</a></div>`;
    return;
  }
  if (type === "signup" && ev.status === "waitlist") {
    app.innerHTML = `<div class="card center">この開催日は定員に達しました。<br><a class="btn waitlist" style="margin-top:14px;display:inline-block;" href="#/event?id=${id}&type=waitlist">キャンセル待ち申し込みへ</a></div>`;
    return;
  }

  const gatherTime = type === "signup" ? hm(ev.gather_time) : subtractMinutes(ev.start_time, 10);
  const detailText = eventDetailText(ev, gatherTime);
  const isWaitlist = type === "waitlist";
  const btnLabel = isWaitlist ? "キャンセル待ち申し込み" : "参加申し込み";
  const btnClass = isWaitlist ? "waitlist" : "open";
  const emphasis = isWaitlist
    ? `<div class="emphasis">キャンセル待ちから参加確定へ繰り上げる場合は、開催前日までに公式LINEからご連絡いたします。</div>`
    : "";
  const errorHtml = errorMsg ? `<div class="error-box">${esc(errorMsg)}</div>` : "";

  let dupHintVisible = false;
  try { dupHintVisible = !!localStorage.getItem("tnt_applied_" + id); } catch (e) {}

  app.innerHTML = `
  <div class="card">
    <h2 class="section-title" style="margin-top:0;">${isWaitlist ? "キャンセル待ち申し込み" : "参加申し込み"}</h2>
    <div class="detail">${detailText}</div>
    ${emphasis}
    ${errorHtml}
    <form id="entryForm">
      <label>①呼び名</label>
      <input type="text" name="nickname" required maxlength="40" placeholder="例）たろう">
      <label>②オープンチャット登録名</label>
      <input type="text" name="line_name" required maxlength="60" placeholder="例）たろう＠バレー歴3年">
      <button type="submit" class="btn ${btnClass} wide">${btnLabel}</button>
    </form>
    <div class="small-note" style="${dupHintVisible ? "" : "display:none;"}">この端末では、この開催日にすでにお申し込み済みの可能性があります。心当たりがない場合はそのままお申し込みください。</div>
  </div>
  <a class="back-link" href="#/">← ホームへ戻る</a>
  `;

  document.getElementById("entryForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const form = e.target;
    const submitBtn = form.querySelector("button[type=submit]");
    submitBtn.disabled = true;
    submitBtn.textContent = "送信中...";
    const nickname = form.nickname.value;
    const line_name = form.line_name.value;
    const { ok, data } = await rpc("submit_entry", {
      p_event_id: id, p_type: type, p_nickname: nickname, p_line_name: line_name,
    });
    if (ok && data && data.ok === true) {
      try { localStorage.setItem("tnt_applied_" + id, "1"); } catch (err) {}
      renderDone(app, id);
    } else {
      const msg = (data && data.error) || "エラーが発生しました。時間をおいて再度お試しください。";
      renderEventPage(app, id, type, msg);
    }
  });
}

function renderDone(app){
  app.innerHTML = `
  <div class="card center">
    <div class="done-icon">☑</div>
    <div style="font-size:18px;font-weight:800;">申し込み完了しました☑</div>
    <p style="color:var(--muted);font-size:13.5px;margin-top:10px;">ご登録ありがとうございます。当日は体育館でお待ちしております🏐</p>
    <a class="btn open wide" href="#/" style="margin-top:18px;">戻る</a>
  </div>
  `;
}

async function route(){
  const r = parseHash();
  const app = document.getElementById("app");
  app.innerHTML = `<div class="card center">読み込み中...</div>`;
  if (r.view === "event") {
    await renderEventPage(app, r.id, r.type, null);
  } else {
    await renderHome(app);
  }
}

window.addEventListener("hashchange", route);
window.addEventListener("DOMContentLoaded", route);
</script>
</body>
</html>
